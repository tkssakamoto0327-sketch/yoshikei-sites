# 献立表サイト：kondate/ に変更が入ったら、既存の Cloudflare Pages プロジェクト
# 「yoshikei-kondate」へ自動で公開する（URL は https://yoshikei-kondate.pages.dev/ のまま）
name: 献立表を公開

on:
  push:
    branches: [main]
    paths:
      - 'kondate/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-kondate
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: data.js と PDF の確認
        run: |
          node -e '
            global.window = {};
            require("./kondate/data.js");
            const fs = require("fs");
            const k = window.KONDATE;
            let ng = 0;
            for (const w of k.weeks) {
              const d = new Date(w.start + "T00:00:00Z");
              if (d.getUTCDay() !== 1) { console.log("月曜ではない週:", w.start); ng++; }
              for (const [key, v] of Object.entries(w.files)) {
                if (v.endsWith(".pdf") && !fs.existsSync("kondate/" + v)) { console.log("PDFが見つからない:", v); ng++; }
              }
            }
            console.log(k.weeks.map(w => w.start + " " + Object.keys(w.files).join(",")).join("\n"));
            process.exit(ng ? 1 : 0);
          '

      - name: Cloudflare Pages へ公開
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN が登録されていません"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID が登録されていません"; exit 1; }
          # 貼り付け時の空白・改行を取り除き、形式をざっと確認（値そのものは表示しない）
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          case "$CLOUDFLARE_API_TOKEN" in
            *curl*|*Bearer*|*Authorization*|*http*) echo "::error::トークン欄にトークン以外の文字（curl の例文など）が入っています。トークンの文字列だけを登録してください"; exit 1;;
          esac
          echo "::notice::トークンの長さ: ${#CLOUDFLARE_API_TOKEN} 文字 / アカウントIDの長さ: ${#CLOUDFLARE_ACCOUNT_ID} 文字"
          printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]+$' || { echo "::error::トークンに使えない文字が含まれています（長さ ${#CLOUDFLARE_API_TOKEN} 文字）。トークンの文字列だけを登録してください"; exit 1; }
          set +e
          npx --yes wrangler@4 pages deploy kondate --project-name=yoshikei-kondate --branch=main --commit-dirty=true > out.log 2>&1
          rc=$?
          cat out.log
          if [ $rc -ne 0 ]; then
            # エラー内容を注釈として残す（ログを開かなくても読めるように）
            grep -vE '^\s*$' out.log | tail -15 | while IFS= read -r l; do echo "::error::$l"; done
          else
            grep -oE 'https://[^ ]+pages\.dev' out.log | tail -1 | sed 's/^/::notice::公開しました /'
          fi
          exit $rc

      - name: 本番URLで確認
        run: |
          # 公開した data.js が本番URL（https://yoshikei-kondate.pages.dev/）で配信されているか確かめる
          want=$(md5sum kondate/data.js | cut -d' ' -f1)
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS -H 'Cache-Control: no-cache' "https://yoshikei-kondate.pages.dev/data.js?v=$GITHUB_RUN_ID" | md5sum | cut -d' ' -f1)
            [ "$got" = "$want" ] && { echo "::notice::本番URLに反映されました https://yoshikei-kondate.pages.dev/"; exit 0; }
            sleep 10
          done
          echo "::error::本番URLの内容が今回の公開と一致しません（本番ブランチの設定を確認）"; exit 1
