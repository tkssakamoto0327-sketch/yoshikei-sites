<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>献立表｜ヨシケイキッチン from ヨシケイ徳島</title>
<meta name="description" content="ヨシケイキッチン（施設様向け食材配達サービス）の週ごとの献立表です。">
<meta name="theme-color" content="#4C8C22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#FBF8F0; --card:#FFFFFF; --line:#EAE4D4; --line2:#F0EBDF;
    --ink:#1C2B16; --ink2:#48573F; --muted:#5C6852;
    --g:#4C8C22; --gd:#2C5A14; --gdd:#1C3D0C; --gt:#EEF7E6;
    --red:#C8231B;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--gd)}
  :focus-visible{outline:3px solid var(--g);outline-offset:2px;border-radius:8px}
  .wrap{width:100%;max-width:760px;margin:0 auto;padding-left:24px;padding-right:24px}
  .maru{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif}

  header{background:#fff;border-top:5px solid var(--g);border-bottom:1px solid #E9E3D3}
  header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;padding-bottom:16px}
  .sub{font-size:12px;color:var(--muted);letter-spacing:.06em;display:block}
  .logo{font-weight:700;font-size:26px;color:var(--gd);letter-spacing:.03em;line-height:1.2;display:block}
  .pill-link{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #DCD3BF;color:var(--ink2);font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:#fff}
  .pill-link:hover{border-color:var(--g)}

  main{flex:1;padding-top:32px;padding-bottom:56px;display:flex;flex-direction:column;gap:20px}
  h1{margin:0;font-weight:700;font-size:30px;letter-spacing:.06em}
  .lead{margin:6px 0 0;font-size:15px;color:var(--ink2)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
  .card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
  .card-h h2{margin:0;font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.06em}
  .note{font-size:12px;color:var(--ink2);background:#F3F0E6;padding:3px 10px;border-radius:999px}

  .courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .course{min-height:56px;padding:10px 14px;border-radius:12px;border:2px solid #E3DCCB;background:#fff;color:var(--ink);font:inherit;font-size:16px;font-weight:700;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .15s,background .15s}
  .course:hover{border-color:var(--g)}
  .course[aria-pressed="true"]{border-color:var(--g);background:var(--gt)}
  .course .name{flex:1}
  .course .check{display:none}
  .course[aria-pressed="true"] .check{display:block}
  .swatch{width:16px;height:16px;border-radius:5px;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12);flex-shrink:0}

  .empty{margin:0;padding:28px 12px;text-align:center;font-size:15px;color:var(--muted);background:#FAF7EE;border-radius:12px}
  .sel-name{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700}
  .sel-name .swatch{width:14px;height:14px;border-radius:4px}
  .weeks{list-style:none;margin:0;padding:0}
  .week{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-top:1px solid var(--line2)}
  .week-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .range{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
  .b-now{background:#FDEBD8;color:#8F3A0E}
  .b-next{background:#E8EEF7;color:#2F4A70}
  .pdf{min-height:46px;padding:0 20px;border-radius:999px;background:var(--gd);color:#fff;font-size:15px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .pdf:hover{background:var(--gdd);color:#fff}
  .pending{min-height:46px;padding:0 20px;border-radius:999px;background:#F1EEE6;color:var(--muted);font-size:14px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap}

  .recipe{background:var(--gt);border:1px solid #D5E6C4;border-radius:16px;padding:18px 20px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:14px}
  .recipe:hover{background:#E5F0D9}
  .recipe .ic{width:44px;height:44px;border-radius:12px;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .recipe .t{flex:1;display:flex;flex-direction:column;gap:2px}
  .recipe .t1{font-size:18px;font-weight:700;color:var(--gd)}
  .recipe .t2{font-size:13px;color:var(--ink2);line-height:1.6}

  footer{border-top:1px solid #E9E3D3;background:#fff}
  footer .wrap{padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--muted)}
  footer b{color:var(--red)}

  @media (max-width:560px){
    .wrap{padding-left:16px;padding-right:16px}
    .week{flex-direction:column;align-items:stretch}
    .pdf,.pending{justify-content:center}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div>
      <span class="sub">施設様向け食材配達サービス</span>
      <span class="logo maru">ヨシケイキッチン!</span>
    </div>
    <a class="pill-link" href="https://sites.google.com/view/tks3301/%E3%83%9B%E3%83%BC%E3%83%A0">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      トップへ
    </a>
  </div>
</header>

<main class="wrap">
  <div>
    <h1 class="maru">献立表</h1>
    <p class="lead">ご契約のコースを選ぶと、週ごとの献立表（PDF）が開けます。</p>
  </div>

  <section class="card" aria-labelledby="h-course">
    <div class="card-h">
      <h2 id="h-course">① コースを選ぶ</h2>
      <span class="note" id="remembered" hidden>前回選んだコースを表示しています</span>
    </div>
    <div class="courses" id="courses"></div>
  </section>

  <section class="card" aria-labelledby="h-week" aria-live="polite">
    <div class="card-h"><h2 id="h-week">② 週を選んで開く</h2></div>
    <div id="weekArea"><p class="empty">上でコースを選ぶと、ここに週ごとの献立表が出ます。</p></div>
  </section>

  <a class="recipe" id="recipe" href="#" target="_blank" rel="noopener">
    <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C5A14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 8h6M9 12h5"/></svg></span>
    <span class="t"><span class="t1 maru">レシピ帳を開く</span><span class="t2">作り方や、人数に合わせた分量はこちら</span></span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2C5A14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </a>
</main>

<footer>
  <div class="wrap maru">ヨシケイキッチン from <b>ヨシケイ徳島</b></div>
</footer>

<script src="data.js"></script>
<script>
(function () {
  var D = window.KONDATE || { courses: [], weeks: [] };
  var KEY = 'yk-kondate-course';
  var WD = ['日','月','火','水','木','金','土'];
  var $courses = document.getElementById('courses');
  var $area = document.getElementById('weekArea');
  var $rem = document.getElementById('remembered');
  var recipe = document.getElementById('recipe');
  if (D.recipeUrl) recipe.href = D.recipeUrl; else recipe.hidden = true;

  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var weeks = D.weeks.slice().sort(function (a, b) { return a.start < b.start ? -1 : 1; });
  var today = new Date(); today.setHours(0, 0, 0, 0);
  // 表示するのは「今週」以降（終わった週は自動で非表示）
  var DAY = 864e5;
  var visible = weeks.filter(function (w) { return (today - parse(w.start)) / DAY < 7; });
  var nowW = visible.filter(function (w) { return parse(w.start) <= today; })[0] || null;
  var nextW = visible.filter(function (w) { var d = (parse(w.start) - today) / DAY; return d > 0 && d <= 7; })[0] || null;

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  var current = D.courses.some(function (c) { return c.key === saved; }) ? saved : null;
  if (current) $rem.hidden = false;

  D.courses.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'course'; b.dataset.key = c.key;
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span class="swatch" style="background:' + esc(c.color) + '"></span><span class="name">' + esc(c.name) + '</span>' +
      '<svg class="check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2C5A14" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    b.addEventListener('click', function () {
      current = c.key; $rem.hidden = true;
      try { localStorage.setItem(KEY, c.key); } catch (e) {}
      render();
      if (window.innerWidth < 700) $area.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    $courses.appendChild(b);
  });

  function render() {
    Array.prototype.forEach.call($courses.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.key === current ? 'true' : 'false');
    });
    if (!current) return;
    var c = D.courses.filter(function (x) { return x.key === current; })[0];
    if (!visible.length) {
      $area.innerHTML = '<p class="empty">献立表を準備中です。しばらくお待ちください。</p>';
      return;
    }
    var html = '<div class="sel-name maru"><span class="swatch" style="background:' + esc(c.color) + '"></span>' + esc(c.name) + '</div><ul class="weeks">';
    visible.forEach(function (w) {
      var d = parse(w.start);
      var label = (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）〜';
      var badge = w === nowW ? '<span class="badge b-now">今週</span>' : (w === nextW ? '<span class="badge b-next">来週</span>' : '');
      var id = w.files && w.files[current];
      var btn = id
        ? '<a class="pdf" href="' + (/\.pdf$/i.test(id) ? esc(encodeURI(id)) : 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view') + '" target="_blank" rel="noopener" aria-label="' + esc((d.getMonth() + 1) + '月' + d.getDate() + '日からの週 ' + c.name + ' の献立表を見る') + '">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>献立表を見る</a>'
        : '<span class="pending">準備中</span>';
      html += '<li class="week"><div class="week-l"><span class="range">' + label + '</span>' + badge + '</div>' + btn + '</li>';
    });
    $area.innerHTML = html + '</ul>';
  }
  render();
})();
</script>
</body>
</html>
