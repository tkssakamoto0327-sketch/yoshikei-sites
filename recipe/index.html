const els = {
  steps: document.getElementById('steps'),
  courseChips: document.getElementById('course-chips'),
  weekChips: document.getElementById('week-chips'),
  dateChips: document.getElementById('date-chips'),
  mealChips: document.getElementById('meal-chips'),
  quickPeople: document.getElementById('quick-people'),
  peopleInput: document.getElementById('people-input'),
  cardWeek: document.getElementById('card-week'),
  cardDate: document.getElementById('card-date'),
  cardMeal: document.getElementById('card-meal'),
  cardPeople: document.getElementById('card-people'),
  cardRecipe: document.getElementById('card-recipe'),
  cardEmpty: document.getElementById('card-empty'),
};

function courseColor(hex) { return '#' + hex; }

// 食材の単位ごとに公式レシピの増量ルールを再現する。
// ヨシケイの3人分・4人分の実データを1人分の記載量と比較した結果:
//  - g/mlなど計量できる単位はほぼ完全に「1人分の量 × 人数」の線形計算どおり(93〜99%が完全一致)。
//  - コ/切/本/枚/袋/ﾊﾟｯｸ/ワなど「個数」で数える単位は、線形計算の結果が整数にならない場合、
//    必ず切り上げ（例: 2/3コ×4人=2.67→3コ、1/3本×4人=1.33→2本）。切り捨てられた例は0件だった。
// これに基づき、個数単位は常に切り上げ、計量単位はそのまま計算した値を表示する。
const DISCRETE_UNITS = new Set(['コ', '個', '切', '本', '枚', '袋', 'ﾊﾟｯｸ', 'パック', 'ワ', '玉', '束', '丁', '尾', '缶', '片']);

function fmtQty(parsed, people) {
  if (!parsed || parsed.value === null || parsed.value === undefined) {
    return { text: parsed ? parsed.raw : '', approx: false };
  }
  const total = parsed.value * people;
  let numStr;
  if (DISCRETE_UNITS.has(parsed.unit)) {
    // 個数単位は必ず切り上げ（浮動小数点誤差を吸収してからceil）
    const rounded = Math.ceil(total - 1e-6);
    numStr = String(rounded);
  } else if (Math.abs(total - Math.round(total)) < 0.01) {
    numStr = String(Math.round(total));
  } else {
    numStr = total.toFixed(1).replace(/\.0$/, '');
    if (total < 10) numStr = total.toFixed(2).replace(/0$/, '').replace(/\.$/, '');
  }
  const prefix = parsed.approx ? '約' : '';
  return { text: `${prefix}${numStr}${parsed.unit}`, approx: parsed.approx };
}

function parseNutrition(str) {
  if (!str) return [];
  const re = /([^\d\s]+)\s*([\d.]+)\s*(kcal|g)/g;
  const out = [];
  let m;
  while ((m = re.exec(str)) !== null) {
    out.push({ label: m[1], value: parseFloat(m[2]), unit: m[3] });
  }
  return out;
}

function currentCourse() { return state.course ? COURSES[state.course] : null; }

function buildSteps() {
  const course = currentCourse();
  const items = [
    { n: 1, label: 'コース', done: !!state.course },
    { n: 2, label: '週', done: !!state.week },
    { n: 3, label: '日付', done: !!state.date },
    { n: 4, label: '食事', done: !!state.meal },
    { n: 5, label: course && course.has_recipe ? '人数' : '内容', done: !!state.meal },
  ];
  els.steps.innerHTML = items.map(it =>
    `<span class="step-pill ${it.done ? 'active' : ''}"><span class="num">${it.n}</span>${it.label}</span>`
  ).join('');
}

// ISO date ("YYYY-MM-DD") -> the Monday that starts its week, as an ISO date string.
// All source data weeks already run Monday-Sunday, so this just needs to key dates
// consistently into their week group.
function mondayIso(iso) {
  const d = new Date(iso + 'T00:00:00Z');
  const day = d.getUTCDay(); // 0=Sun..6=Sat
  const diff = day === 0 ? -6 : 1 - day;
  d.setUTCDate(d.getUTCDate() + diff);
  return d.toISOString().slice(0, 10);
}

function mdLabel(iso) {
  const d = new Date(iso + 'T00:00:00Z');
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
}

function getWeeks(course) {
  const isoList = Object.keys(course.days);
  const map = new Map();
  isoList.forEach(iso => {
    const wk = mondayIso(iso);
    if (!map.has(wk)) map.set(wk, []);
    map.get(wk).push(iso);
  });
  return Array.from(map.entries())
    .sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0))
    .map(([weekStart, isos]) => {
      const sorted = isos.slice().sort();
      return {
        key: weekStart,
        isos: sorted,
        label: `${mdLabel(sorted[0])}週`,
      };
    });
}

function renderCourses() {
  els.courseChips.innerHTML = '';
  COURSE_ORDER.forEach(key => {
    const c = COURSES[key];
    if (!c) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip course' + (state.course === key ? ' selected' : '');
    btn.style.setProperty('--course-color', courseColor(c.color));
    const metaText = c.has_recipe ? 'レシピあり' : 'レシピは準備中';
    btn.innerHTML = `<span class="dot"></span><span><div>${c.label}</div><div class="course-meta">${metaText}</div></span>`;
    btn.addEventListener('click', () => {
      if (state.course !== key) {
        state.course = key;
        state.week = null; state.date = null; state.meal = null;
        renderAll();
      }
    });
    els.courseChips.appendChild(btn);
  });
}

function renderWeeks() {
  const course = currentCourse();
  if (!course) { els.cardWeek.hidden = true; return; }
  const weeks = getWeeks(course);
  if (weeks.length <= 1) {
    // Only one week of data: skip this step entirely, just auto-select it.
    els.cardWeek.hidden = true;
    if (!state.week && weeks.length === 1) state.week = weeks[0].key;
    return;
  }
  els.cardWeek.hidden = false;
  els.weekChips.innerHTML = '';
  weeks.forEach(w => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (state.week === w.key ? ' selected' : '');
    btn.textContent = w.label;
    btn.addEventListener('click', () => {
      if (state.week !== w.key) {
        state.week = w.key;
        state.date = null; state.meal = null;
        renderAll();
      }
    });
    els.weekChips.appendChild(btn);
  });
}

function renderDates() {
  const course = currentCourse();
  if (!course || !state.week) { els.cardDate.hidden = true; return; }
  els.cardDate.hidden = false;
  const weeks = getWeeks(course);
  const week = weeks.find(w => w.key === state.week);
  const isoList = week ? week.isos : [];
  els.dateChips.innerHTML = '';
  isoList.forEach(iso => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (state.date === iso ? ' selected' : '');
    btn.textContent = course.days[iso].short_label || iso;
    btn.addEventListener('click', () => {
      state.date = iso;
      state.meal = null;
      renderAll();
    });
    els.dateChips.appendChild(btn);
  });
}

function renderMeals() {
  const course = currentCourse();
  if (!course || !state.date) { els.cardMeal.hidden = true; return; }
  els.cardMeal.hidden = false;
  const day = course.days[state.date];
  const available = MEAL_ORDER.filter(m => day.meals[m]);
  els.mealChips.innerHTML = '';
  available.forEach(m => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (state.meal === m ? ' selected' : '');
    btn.textContent = m;
    btn.addEventListener('click', () => {
      state.meal = m;
      renderAll();
    });
    els.mealChips.appendChild(btn);
  });
}

function renderPeopleCard() {
  const course = currentCourse();
  if (!course || !course.has_recipe || !state.meal) { els.cardPeople.hidden = true; return; }
  els.cardPeople.hidden = false;
  els.quickPeople.innerHTML = '';
  [3, 4, 5, 6, 7, 8].forEach(n => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = `${n}人`;
    btn.addEventListener('click', () => {
      state.people = n;
      els.peopleInput.value = n;
      renderRecipe();
    });
    els.quickPeople.appendChild(btn);
  });
}

function renderNutritionBox(nutrition, people, title) {
  if (!nutrition) return '';
  const items = parseNutrition(nutrition);
  if (people <= 1) {
    const grid = items.map(it =>
      `<div class="nutrition-item"><div class="n-label">${it.label}</div><div class="n-value">${it.value}${it.unit}</div></div>`
    ).join('');
    return `<h3 class="section-h">${title}</h3>
      <div class="nutrition-box">
        <div class="nutrition-grid">${grid}</div>
      </div>`;
  }
  const scaled = items.map(it => {
    const total = it.value * people;
    const totalStr = Number.isInteger(total) ? total : Math.round(total * 10) / 10;
    return `<div class="nutrition-item"><div class="n-label">${it.label}</div><div class="n-value">${totalStr}${it.unit}</div></div>`;
  }).join('');
  return `<h3 class="section-h">${title}</h3>
    <div class="nutrition-box">
      <div>1人分：${nutrition}</div>
      <div class="nutrition-grid">${scaled}</div>
      <div class="nutrition-caption">上段は献立表の1人分表記、グリッドは${people}人分に換算した目安値です。</div>
    </div>`;
}

const ALLERGEN_ORDER = ['えび', 'かに', '小麦', 'そば', '卵', '乳成分', '落花生', 'くるみ'];
function mealAllergenBand(dishes, label) {
  const found = new Set();
  dishes.forEach(d => (d.allergens || []).forEach(a => String(a).split(/[\s　]+/).filter(Boolean).forEach(t => found.add(t))));
  const sorted = [...found].sort((a, b) => {
    const ia = ALLERGEN_ORDER.indexOf(a), ib = ALLERGEN_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  const body = sorted.length
    ? `<span class="alg-list">${sorted.join('・')}</span>`
    : '<span class="alg-none">記載なし</span>';
  return `<div class="alg-band"><span class="alg-label">⚠ ${label}のアレルゲン</span>${body}</div>`;
}

function renderPhoto(mealData) {
  if (!mealData.photo) return '';
  return `<figure class="meal-photo">
    <img src="${mealData.photo}" alt="盛付例の写真" loading="lazy">
    <figcaption>写真は盛付例です</figcaption>
  </figure>`;
}

function renderRecipe() {
  const course = currentCourse();
  if (!course || !state.date || !state.meal) {
    els.cardRecipe.hidden = true;
    els.cardEmpty.hidden = false;
    return;
  }
  els.cardEmpty.hidden = true;
  els.cardRecipe.hidden = false;

  const day = course.days[state.date];
  const mealData = day.meals[state.meal];
  const dayLabel = day.short_label;

  if (!course.has_recipe) {
    // Overview-only course: dish names + nutrition, recipe detail not yet available.
    const dishListHtml = mealData.dishes.map((name, i) =>
      `<li><span class="dish-order">${i + 1}</span>${name}</li>`
    ).join('');
    const nutritionHtml = renderNutritionBox(mealData.nutrition, 1, 'この食事の栄養価（1人分）');
    const dayTotalHtml = day.day_total
      ? `<div class="day-total-box"><span class="n-label-inline">1日の合計栄養価：</span>${day.day_total.replace(/\n/g, '　')}</div>`
      : '';
    const noteHtml = course.global_note
      ? `<div class="footnotes"><p>${course.global_note.trim()}</p></div>` : '';

    els.cardRecipe.innerHTML = `
      <div class="recipe-head">
        <h2 class="recipe-title">${dayLabel} ${state.meal} ${course.label}</h2>
      </div>
      ${renderPhoto(mealData)}
      <div class="coming-soon">🔧 材料・作り方の詳細レシピは近日追加予定です。まずは献立をご確認ください。</div>
      <h3 class="section-h">献立</h3>
      <ul class="dish-name-list">${dishListHtml}</ul>
      ${nutritionHtml}
      ${dayTotalHtml}
      ${noteHtml}
    `;
    return;
  }

  // has_recipe course: full ingredient / method detail, scaled to the chosen people count.
  const dishes = mealData.dishes;
  const people = state.people;

  const dishBlocks = dishes.map((dish, i) => {
    const allergenHtml = (dish.allergens && dish.allergens.length)
      ? `<div class="allergen-chips">${dish.allergens.map(a => `<span class="allergen-chip">⚠ ${a}</span>`).join('')}</div>`
      : '';

    const ingredientRows = dish.ingredients.map(ing => {
      const q = fmtQty(ing.qty1_parsed, people);
      const indentClass = ing.name.startsWith('　') ? ' indented' : '';
      const cleanName = ing.name.replace(/^　+/, '');
      const ownTag = ing.own ? '<span class="own-tag">ご用意</span>' : '';
      return `<tr class="${ing.own ? 'own' : ''}">
        <td class="ing-name${indentClass}">${cleanName}${ownTag}</td>
        <td class="ing-qty">${q.text}</td>
      </tr>`;
    }).join('');

    const methodSteps = (dish.method || '')
      .split(/(?<=^|\n)[①-⑳]/)
      .map(s => s.trim())
      .filter(Boolean);
    const methodHtml = methodSteps.length
      ? `<ol class="method">${methodSteps.map(s => `<li>${s}</li>`).join('')}</ol>`
      : '<p class="empty-hint">作り方の記載はありません。</p>';

    return `
      <div class="dish-block${i > 0 ? ' dish-block-sep' : ''}">
        <h3 class="dish-title"><span class="dish-order">${i + 1}</span>${dish.name}</h3>
        ${allergenHtml}
        <h4 class="section-h">材料</h4>
        <table class="ingredients"><tbody>${ingredientRows}</tbody></table>
        <h4 class="section-h">作り方</h4>
        ${methodHtml}
      </div>`;
  }).join('');

  const hasOwn = dishes.some(d => d.ingredients.some(ing => ing.own));
  const nutritionHtml = renderNutritionBox(mealData.nutrition, people, `${dishes.length}品まとめての栄養価`);
  const noteHtml = course.global_note
    ? `<div class="footnotes"><p>${course.global_note.trim()}</p></div>` : '';

  els.cardRecipe.innerHTML = `
    <div class="recipe-head">
      <h2 class="recipe-title">${dayLabel} ${state.meal} ${course.label}</h2>
      <span class="recipe-serves">${people}人分</span>
    </div>
    ${mealAllergenBand(dishes, state.meal)}
    ${renderPhoto(mealData)}
    <p class="recipe-count">${dishes.length}品まとめて表示しています</p>
    ${hasOwn ? '<p class="own-legend"><span class="own-tag">ご用意</span><b>赤い材料</b>は、お客様でご用意ください</p>' : ''}
    ${dishBlocks}
    ${nutritionHtml}
    ${noteHtml}
  `;
}

function renderAll() {
  renderWeeks();
  buildSteps();
  renderCourses();
  renderDates();
  renderMeals();
  renderPeopleCard();
  if (!state.course || !state.date || !state.meal) {
    els.cardRecipe.hidden = true;
    els.cardEmpty.hidden = false;
  } else {
    renderRecipe();
  }
}

els.peopleInput.addEventListener('input', () => {
  let v = parseInt(els.peopleInput.value, 10);
  if (isNaN(v) || v < 3) v = 3;
  if (v > 30) v = 30;
  state.people = v;
  renderRecipe();
});
document.getElementById('people-minus').addEventListener('click', () => {
  state.people = Math.max(3, state.people - 1);
  els.peopleInput.value = state.people;
  renderRecipe();
});
document.getElementById('people-plus').addEventListener('click', () => {
  state.people = Math.min(30, state.people + 1);
  els.peopleInput.value = state.people;
  renderRecipe();
});

renderAll();
</script>

</body></html>
